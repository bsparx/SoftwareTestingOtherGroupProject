name: Playwright E2E

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
      PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
      PW_RESIDENT_EMAIL: ${{ secrets.PW_RESIDENT_EMAIL }}
      PW_RESIDENT_PASSWORD: ${{ secrets.PW_RESIDENT_PASSWORD }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e -- --grep "USE-02|ADMIN-01"
